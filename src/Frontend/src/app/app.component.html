<header class="topbar">
  <a class="brand" routerLink="/devices" aria-label="PingLight home"><span class="brand-mark">P</span>PingLight<span class="brand-dot"></span></a>
  <div class="account" *ngIf="auth.user$ | async as user">
    <span>{{ user.profile.email || 'Your account' }}</span>
    <button class="quiet" type="button" (click)="signOut()" [disabled]="session.pendingWrites > 0">Sign out</button>
  </div>
</header>

<main>
  <div class="alert error" role="alert" *ngIf="error">{{ error }}</div>
  <ng-container *ngIf="auth.user$ | async; else welcome">
    <p class="loading" role="status" *ngIf="loading">Loading your workspace…</p>
    <button *ngIf="!loading && !session.currentUser" type="button" (click)="loadUser()">Retry loading workspace</button>
    <ng-container *ngIf="session.currentUser as user">
      <nav class="page-nav" aria-label="Workspace">
        <a routerLink="/devices" routerLinkActive="active" ariaCurrentWhenActive="page">{{ user.isSystemAdmin ? 'All devices' : 'My devices' }}</a>
        <a *ngIf="user.isSystemAdmin" routerLink="/users" routerLinkActive="active" ariaCurrentWhenActive="page">User device access</a>
      </nav>
      <router-outlet></router-outlet>
    </ng-container>
  </ng-container>
  <ng-template #welcome>
    <app-welcome [ready]="ready" [configured]="!!auth.config" (signIn)="signIn()"></app-welcome>
  </ng-template>
</main>
<footer>PingLight <span>Small signals. A clearer picture.</span></footer>
