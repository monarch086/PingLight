# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: barsuk
# https://www.serverless.com/framework/docs-providers-aws-guide-functions
service: pinglight

provider:
  name: aws
  runtime: dotnet8
  region: eu-central-1
  memorySize: 256
  versionFunctions: false
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:DescribeTable
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - 'arn:aws:dynamodb:eu-central-1:469321902251:table/PingLight.${sls:stage}.*'
        - Effect: "Allow"
          Action:
           - "ssm:GetParameter"
          Resource: "arn:aws:ssm:eu-central-1:469321902251:parameter/PingLight/${sls:stage}/*"

package:
  individually: true

custom:
  environments:
    dev:
      environment: development
    prod:
      environment: production

functions:
  test:
    handler: PingLight.Test::PingLight.Test.Function::FunctionHandler
    package:
      artifact: PingLight.Test/bin/Release/net8.0/deploy-package.zip
    name: pinglight-${sls:stage}-test
    environment:
      STAGE: ${opt:stage, self:provider.stage}
      CUSTOM_ENV: ${self:custom.environments.${opt:stage, self:provider.stage}.environment}
    timeout: 10
    url:
      cors: true
    events:
     - http:
         path: /test
         method: GET

  gather-api:
    handler: PingLight.GatherApi.Lambda::PingLight.GatherApi.Lambda.Function::FunctionHandler
    package:
      artifact: PingLight.GatherApi.Lambda/bin/Release/net8.0/deploy-package.zip
    name: pinglight-${sls:stage}-gather-api
    environment:
      STAGE: ${opt:stage, self:provider.stage}
    timeout: 10
    url:
      cors: true
    events:
     - http:
         path: /pings
         method: POST

  aggregate-changes:
    handler: PingLight.AggregateChanges.Lambda::PingLight.AggregateChanges.Lambda.Function::FunctionHandler
    package:
      artifact: PingLight.AgregateChanges.Lambda/bin/Release/net8.0/deploy-package.zip
    name: pinglight-${sls:stage}-aggregate-changes
    environment:
      STAGE: ${opt:stage, self:provider.stage}
    timeout: 30
    memorySize: 320
    events:
      - schedule:
          rate: rate(1 minute)
          enabled: true

  daily-stats:
    handler: PingLight.DailyStats.Lambda::PingLight.DailyStats.Lambda.Function::FunctionHandler
    package:
      artifact: PingLight.DailyStats.Lambda/bin/Release/net8.0/deploy-package.zip
    name: pinglight-${sls:stage}-daily-stats
    environment:
      STAGE: ${opt:stage, self:provider.stage}
    timeout: 15
    memorySize: 256
    events:
      - schedule:
          rate: cron(0 7 * * ? *)
          enabled: true

  weekly-stats:
    handler: PingLight.WeeklyStats.Lambda::PingLight.WeeklyStats.Lambda.Function::FunctionHandler
    package:
      artifact: PingLight.WeeklyStats.Lambda/bin/Release/net8.0/deploy-package.zip
    name: pinglight-${sls:stage}-weekly-stats
    environment:
      STAGE: ${opt:stage, self:provider.stage}
    timeout: 15
    memorySize: 256
    events:
      - schedule:
          rate: cron(0 7 ? * MON *)
          enabled: true

  monthly-stats:
    handler: PingLight.MonthlyStats.Lambda::PingLight.MonthlyStats.Lambda.Function::FunctionHandler
    package:
      artifact: PingLight.MonthlyStats.Lambda/bin/Release/net8.0/deploy-package.zip
    name: pinglight-${sls:stage}-monthly-stats
    environment:
      STAGE: ${opt:stage, self:provider.stage}
    timeout: 20
    memorySize: 512
    events:
      - schedule:
          rate: cron(0 9 1 * ? *)
          enabled: true

  turn-off-notifications:
    handler: PingLight.TurnOffNotifications.Lambda::PingLight.TurnOffNotifications.Lambda.Function::FunctionHandler
    package:
      artifact: PingLight.TurnOffNotifications.Lambda/bin/Release/net8.0/deploy-package.zip
    name: pinglight-${sls:stage}-turn-off-notifications
    environment:
      STAGE: ${opt:stage, self:provider.stage}
    timeout: 15
    memorySize: 192
    events:
      - schedule:
          rate: cron(0 4-20 * * ? *)
          enabled: true